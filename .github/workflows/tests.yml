name: Testes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Roda a suíte do Mocha (mesma configuração do npm test) com o reporter
      # mochawesome; o job falha se algum teste falhar.
      - name: Rodar testes e gerar relatório
        run: npm run test:report

      - name: Publicar relatório mochawesome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report
          path: mochawesome-report/
          if-no-files-found: warn
          retention-days: 30
